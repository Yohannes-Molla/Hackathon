spring:
  application:
    name: tx-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/trust-layer
  datasource:
    url: jdbc:postgresql://localhost:5432/trust_layer
    username: tl_user
    password: tl_password
  redis:
    host: localhost
    port: 6379

server:
  port: 9003

logging:
  level:
    root: INFO
    et.trustlayer: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
