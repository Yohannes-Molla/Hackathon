[tool.poetry]
name = "uail-ai-service"
version = "0.1.0"
description = "AI Service for UAIL - Face Recognition, Liveness Detection, Fraud Detection"
authors = ["UAIL Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"

# API
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }

# Data & Processing
numpy = "^1.26.0"
pandas = "^2.2.0"

# Image Processing
opencv-python = "^4.9.0.80"
Pillow = "^10.2.0"

# AI / ML
torch = "^2.2.0"
torchvision = "^0.17.0"
scikit-learn = "^1.4.0"

# Face Recognition (optional lightweight)
facenet-pytorch = "^2.5.3"

# Validation
pydantic = "^2.6.0"

# HTTP client (for internal calls)
httpx = "^0.27.0"

# Security / Crypto
cryptography = "^42.0.0"

# Logging
loguru = "^0.7.2"

# Env
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.0"
pytest-asyncio = "^0.23.0"
black = "^24.3.0"
isort = "^5.13.0"
flake8 = "^7.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
