services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: tl-keycloak
    command:
      - start-dev
      - --import-realm
    ports:
      - "${TL_KEYCLOAK_PORT:-8180}:8080"
    environment:
      KEYCLOAK_ADMIN: ${TL_KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${TL_KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak/realm-trust-layer.json:/opt/keycloak/data/import/realm-trust-layer.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: tl-postgres
    ports:
      - "${TL_POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${TL_DB_NAME:-trust_layer}
      POSTGRES_USER: ${TL_DB_USER:-tl_user}
      POSTGRES_PASSWORD: ${TL_DB_PASSWORD:-tl_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tl_user -d trust_layer"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tl-redis
    ports:
      - "${TL_REDIS_PORT:-6379}:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:1.15
    container_name: tl-vault
    ports:
      - "${TL_VAULT_PORT:-8200}:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    container_name: tl-mailpit
    ports:
      - "${TL_MAILPIT_UI_PORT:-8025}:8025"
      - "${TL_MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_DEBUG: "false"

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: tl-ai-service
    ports:
      - "${TL_AI_SERVICE_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  auth-server:
    build:
      context: ..
      dockerfile: auth-server/Dockerfile
    container_name: tl-auth-server
    ports:
      - "${TL_AUTH_SERVER_PORT:-9000}:9000"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TL_DB_URL: ${TL_DB_URL:-jdbc:postgresql://postgres:5432/trust_layer}
      TL_DB_USER: ${TL_DB_USER:-tl_user}
      TL_DB_PASSWORD: ${TL_DB_PASSWORD:-tl_password}
      TL_REDIS_HOST: ${TL_REDIS_HOST:-redis}
      TL_REDIS_PORT: "6379"
      TL_OIDC_ISSUER_URI: ${TL_OIDC_ISSUER_URI:-http://host.docker.internal:8180/realms/trust-layer}
      TL_KEYCLOAK_BASE_URL: ${TL_KEYCLOAK_BASE_URL:-http://host.docker.internal:8180}
      TL_KEYCLOAK_REALM: ${TL_KEYCLOAK_REALM:-trust-layer}
      TL_KEYCLOAK_ADMIN_CLIENT_ID: ${TL_KEYCLOAK_ADMIN_CLIENT_ID:-admin-cli}
      TL_KEYCLOAK_ADMIN_CLIENT_SECRET: ${TL_KEYCLOAK_ADMIN_CLIENT_SECRET:-}
      TL_KEYCLOAK_ADMIN_USERNAME: ${TL_KEYCLOAK_ADMIN_USERNAME:-admin}
      TL_KEYCLOAK_ADMIN_PASSWORD: ${TL_KEYCLOAK_ADMIN_PASSWORD:-admin}
      TL_KEYCLOAK_ADMIN_REALM: ${TL_KEYCLOAK_ADMIN_REALM:-master}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9000/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  ekyc-service:
    build:
      context: ..
      dockerfile: ekyc-service/Dockerfile
    container_name: tl-ekyc-service
    ports:
      - "${TL_EKYC_SERVICE_PORT:-9002}:9002"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TL_DB_URL: ${TL_DB_URL:-jdbc:postgresql://postgres:5432/trust_layer}
      TL_DB_USER: ${TL_DB_USER:-tl_user}
      TL_DB_PASSWORD: ${TL_DB_PASSWORD:-tl_password}
      TL_REDIS_HOST: ${TL_REDIS_HOST:-redis}
      TL_REDIS_PORT: "6379"
      TL_OIDC_ISSUER_URI: ${TL_OIDC_ISSUER_URI:-http://host.docker.internal:8180/realms/trust-layer}
      TL_AI_BASE_URL: ${TL_AI_BASE_URL:-http://ai-service:5000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9002/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  tx-service:
    build:
      context: ..
      dockerfile: tx-service/Dockerfile
    container_name: tl-tx-service
    ports:
      - "${TL_TX_SERVICE_PORT:-9003}:9003"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TL_DB_URL: ${TL_DB_URL:-jdbc:postgresql://postgres:5432/trust_layer}
      TL_DB_USER: ${TL_DB_USER:-tl_user}
      TL_DB_PASSWORD: ${TL_DB_PASSWORD:-tl_password}
      TL_REDIS_HOST: ${TL_REDIS_HOST:-redis}
      TL_REDIS_PORT: "6379"
      TL_OIDC_ISSUER_URI: ${TL_OIDC_ISSUER_URI:-http://host.docker.internal:8180/realms/trust-layer}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9003/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  vci-service:
    build:
      context: ..
      dockerfile: vci-service/Dockerfile
    container_name: tl-vci-service
    ports:
      - "${TL_VCI_SERVICE_PORT:-9004}:9004"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TL_DB_URL: ${TL_DB_URL:-jdbc:postgresql://postgres:5432/trust_layer}
      TL_DB_USER: ${TL_DB_USER:-tl_user}
      TL_DB_PASSWORD: ${TL_DB_PASSWORD:-tl_password}
      TL_OIDC_ISSUER_URI: ${TL_OIDC_ISSUER_URI:-http://host.docker.internal:8180/realms/trust-layer}
      TL_VAULT_BASE_URL: ${TL_VAULT_BASE_URL:-http://vault:8200}
      TL_VAULT_TOKEN: ${TL_VAULT_TOKEN:-root}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9004/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    container_name: tl-gateway
    ports:
      - "${TL_GATEWAY_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TL_WEB_ORIGIN: ${TL_WEB_ORIGIN:-http://localhost:3000}
      TL_WEB_ORIGIN_ALT: ${TL_WEB_ORIGIN_ALT:-http://127.0.0.1:3000}
      TL_KEYCLOAK_ORIGIN: ${TL_KEYCLOAK_ORIGIN:-http://localhost:8180}
      TL_AUTH_SERVER_URI: ${TL_AUTH_SERVER_URI:-http://auth-server:9000}
      TL_EKYC_SERVICE_URI: ${TL_EKYC_SERVICE_URI:-http://ekyc-service:9002}
      TL_TX_SERVICE_URI: ${TL_TX_SERVICE_URI:-http://tx-service:9003}
      TL_VCI_SERVICE_URI: ${TL_VCI_SERVICE_URI:-http://vci-service:9004}
    depends_on:
      auth-server:
        condition: service_healthy
      ekyc-service:
        condition: service_healthy
      tx-service:
        condition: service_healthy
      vci-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: tl-frontend
    ports:
      - "${TL_FRONTEND_PORT:-3000}:80"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
