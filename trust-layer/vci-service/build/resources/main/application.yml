spring:
  application:
    name: vci-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/trust-layer
  datasource:
    url: jdbc:postgresql://localhost:5432/trust_layer
    username: tl_user
    password: tl_password

server:
  port: 9004

logging:
  level:
    root: INFO
    et.trustlayer: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

trustlayer:
  vault:
    base-url: http://localhost:8200
    token: root
