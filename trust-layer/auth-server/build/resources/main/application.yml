spring:
  application:
    name: auth-server
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/trust_layer
    username: tl_user
    password: tl_password
    hikari:
      maximum-pool-size: 10
  redis:
    host: localhost
    port: 6379
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 9000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    et.trustlayer: DEBUG
