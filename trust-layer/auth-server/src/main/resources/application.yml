spring:
  application:
    name: auth-server
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/trust_layer
    username: tl_user
    password: tl_password
    hikari:
      maximum-pool-size: 10
  redis:
    host: localhost
    port: 6379
  flyway:
    enabled: true
    baseline-on-migrate: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/trust-layer

server:
  port: 9000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    et.trustlayer: DEBUG

trustlayer:
  keycloak:
    base-url: http://localhost:8180
    realm: trust-layer
    admin-client-id: admin-cli
    admin-client-secret:
    admin-username: admin
    admin-password: admin
    admin-realm: master
